<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Vendedor - COBRANZAS 611</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1>Panel Vendedor</h1>
        <p id="welcomeText" class="mb-0"></p>
      </div>
      <button id="logoutBtn" class="btn btn-outline-secondary">Cerrar sesión</button>
    </div>

    <div class="row">
      <div class="col-lg-7">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Clientes a visitar hoy</h2>
            <div id="rutaContainer" class="row g-3"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Registrar Cobro</h2>
            <form id="cobranzaForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="clienteNombre" class="form-label">Cliente</label>
                <input type="text" id="clienteNombre" name="razonSocial" class="form-control" readonly required />
              </div>
              <div class="mb-3">
                <label for="clienteCodigo" class="form-label">Código</label>
                <input type="text" id="clienteCodigo" name="clienteId" class="form-control" readonly required />
              </div>
              <div class="mb-3">
                <label for="saldoAnterior" class="form-label">Saldo Pendiente</label>
                <input type="number" id="saldoAnterior" name="saldoAnterior" class="form-control" readonly required />
              </div>
              <div class="mb-3">
                <label for="montoCobrado" class="form-label">Monto Cobrado</label>
                <input type="number" id="montoCobrado" name="montoCobrado" class="form-control" min="0.01" step="0.01" required />
              </div>
              <div class="mb-3">
                <label for="fechaTransferencia" class="form-label">Fecha Transferencia</label>
                <input type="date" id="fechaTransferencia" name="fechaTransferencia" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea id="observaciones" name="observaciones" class="form-control" rows="3"></textarea>
              </div>
              <div class="mb-3">
                <label for="prioridad" class="form-label">Prioridad</label>
                <select id="prioridad" name="prioridad" class="form-select" required>
                  <option value="">Seleccionar prioridad</option>
                  <option value="Prioridad 1 - Despacho en el Acto">Prioridad 1 - Despacho en el Acto</option>
                  <option value="Prioridad 2 - Gestión Regular">Prioridad 2 - Gestión Regular</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="comprobante" class="form-label">Comprobante</label>
                <input type="file" id="comprobante" name="comprobante" class="form-control" accept=".jpg,.jpeg,.png,.pdf" required />
              </div>
              <div class="mb-3">
                <label for="retencion" class="form-label">Retención</label>
                <input type="file" id="retencion" name="retencion" class="form-control" accept=".jpg,.jpeg,.png,.pdf" />
              </div>
              <button class="btn btn-success w-100" type="submit">Guardar Cobro</button>
            </form>
            <div id="cobranzaMessage" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/vendedor.js"></script>
</body>
</html>
