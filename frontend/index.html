<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBRANZAS-611 - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="card-title text-center mb-4">COBRANZAS 611</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" id="usuario" name="usuario" class="form-control" placeholder="V31 o admin" required />
              </div>
              <div class="mb-3">
                <label for="clave" class="form-label">Clave</label>
                <input type="password" id="clave" name="clave" class="form-control" placeholder="Contraseña" required />
              </div>
              <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
            <div id="message" class="mt-3"></div>
            <div class="mt-4 text-muted small">
              <p>Vendedores: V31, V32, ..., V65.</p>
              <p>Administrador: usuario <strong>admin</strong>, clave <strong>611admin</strong>.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
