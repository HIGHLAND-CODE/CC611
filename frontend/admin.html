<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrador - COBRANZAS 611</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Panel Administrador</h1>
      <button id="logoutBtn" class="btn btn-outline-secondary">Cerrar sesión</button>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Subir cuentas corrientes</h2>
            <form id="formDeudas">
              <div class="mb-3">
                <label for="deudasFile" class="form-label">Archivo XLSX</label>
                <input type="file" id="deudasFile" name="deudasFile" class="form-control" accept=".xlsx" required />
              </div>
              <button class="btn btn-primary" type="submit">Procesar Deudas</button>
            </form>
            <div id="deudasMessage" class="mt-3"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Subir día de visita</h2>
            <form id="formVisitas">
              <div class="mb-3">
                <label for="visitasFile" class="form-label">Archivo XLSX</label>
                <input type="file" id="visitasFile" name="visitasFile" class="form-control" accept=".xlsx" required />
              </div>
              <button class="btn btn-primary" type="submit">Procesar Visitas</button>
            </form>
            <div id="visitasMessage" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2>Instrucciones</h2>
        <p>Use los archivos <strong>cuentas corrientes 611.xlsx</strong> y <strong>dia de visita clientes 611.xlsx</strong>.</p>
        <p>Los archivos se procesan con SheetJS y se guardan en el backend.</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
